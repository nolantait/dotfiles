# Upterm configuration.
#
# This file is symlinked from ~/.config/upterm/config.yaml.
# Precedence: command-line flags > UPTERM_* environment > this file > defaults.

# Default relay for `upterm host` when --server is not given. The pair-program
# script passes --server explicitly, and the relay address is intentionally not
# recorded in this public repo.
# server: ssh://RELAY_HOST:2222

# Guest allowlist. Prefer passing --authorized-keys or --authorized-user on the
# command line (the pair-program script does). A bare "~" is NOT expanded here,
# so a value of ~/.ssh/authorized_keys makes `upterm host` fail; use an absolute
# path if you set this.
# authorized-keys: /absolute/path/to/authorized_keys

# ~/.ssh/known_hosts is also the default for --known-hosts. Keep it that way so
# the self-hosted relay's pinned key is checked; never use --skip-host-key-check
# for regular sessions.

# Defaults that are safe for shared sessions:
# accept: false        # --accept also enables sftp
# read-only: false
# hide-client-ip: false
